<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tiehan Fan — research interests in Multimodal LLMs, visual generation and understanding. Publications and CV."
    />
    <meta property="og:title" content="Tiehan Fan | Multimodal LLMs & Visual Generation" />
    <meta
      property="og:description"
      content="Research interests in Multimodal LLMs, visual generation and understanding. Publications and CV."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fantiehan.github.io/" />
    <meta property="og:image" content="https://fantiehan.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Tiehan Fan | Multimodal LLMs & Visual Generation</title>
    <!-- The paper colour and theme, in place before anything else has loaded. -->
    <style>
      html { background: #f4ecd8; }
      html.dark { background: #191612; }
    </style>
    <script>
      try {
        document.documentElement.classList.add(
          localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
        );
      } catch (error) {}
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
